<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>AVARA — Review your order</title>
<meta name="theme-color" content="#2F8F9D">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/vendor/supabase-2.45.4.js"></script>
<style>
  :root{ --teal:#2F8F9D; --teal-deep:#1F5F6B; --mint:#DFF4F1; --mint-2:#C6E5E0; --ivory:#FAF9F6; --ink:#2C2C2C; --ink-soft:#5B5F5F; --danger:#8A2E20; --star:#C9962B;
         --font:'Jost','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif; }
  [lang="ar"]{ --font:'Tajawal','Jost',system-ui,-apple-system,'Segoe UI',sans-serif; }
  [lang="ar"] *{ letter-spacing:0 !important; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--font); line-height:1.65; color:var(--ink); background:var(--ivory); -webkit-font-smoothing:antialiased; }
  a{ color:var(--teal-deep); }
  :focus-visible{ outline:2px solid var(--teal-deep); outline-offset:3px; }
  [hidden]{ display:none !important; }
  .bar{ background:var(--teal-deep); color:#fff; text-align:center; font-size:.84rem; letter-spacing:.12em; padding:9px 16px; }
  header{ background:rgba(250,249,246,.96); border-bottom:1px solid var(--mint-2); }
  .head{ width:min(640px,100% - 48px); margin-inline:auto; padding:16px 0; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .head img{ height:26px; width:auto; display:block; }
  .head nav{ display:flex; align-items:center; gap:18px; }
  .head a, .head button{ font:inherit; font-size:.95rem; text-decoration:none; color:var(--ink); background:none; border:0; cursor:pointer; padding:6px 2px; border-bottom:1px solid transparent; }
  .head a:hover, .head button:hover{ border-color:var(--teal); color:var(--teal-deep); }
  main{ width:min(640px,100% - 48px); margin-inline:auto; padding:48px 0 96px; }
  h1{ font-weight:300; font-size:clamp(1.9rem,4vw,2.6rem); line-height:1.15; margin-bottom:8px; }
  .lead{ color:var(--ink-soft); margin-bottom:28px; }
  form{ display:grid; gap:14px; }
  label, fieldset{ display:grid; gap:5px; font-size:.9rem; color:var(--ink-soft); border:0; }
  legend{ font-size:.9rem; color:var(--ink-soft); margin-bottom:6px; }
  input[type="text"], input[type="tel"], input:not([type]), textarea{ width:100%; padding:11px 12px; font:inherit; font-size:1rem; color:var(--ink); background:#fff; border:1px solid var(--teal); border-radius:2px; }
  textarea{ resize:vertical; min-height:110px; }
  .stars{ display:flex; gap:6px; }
  .stars input{ position:absolute; opacity:0; width:1px; height:1px; }
  .stars label{ position:relative; display:block; font-size:2.2rem; line-height:1; color:var(--mint-2); cursor:pointer; padding:2px; transition:color .15s ease, transform .15s ease; }
  .stars label.on{ color:var(--star); }
  .stars label:hover{ transform:scale(1.12); }
  .stars input:focus-visible + label{ outline:2px solid var(--teal-deep); outline-offset:2px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.85rem 1.7rem; font:inherit; font-weight:500; font-size:.95rem; text-decoration:none; cursor:pointer;
        border:1px solid var(--teal-deep); border-radius:2px; background:var(--teal-deep); color:#fff; transition:background .25s ease; }
  .btn:hover{ background:var(--ink); border-color:var(--ink); }
  .btn[disabled]{ opacity:.6; cursor:progress; }
  .btn--line{ background:transparent; color:var(--ink); }
  .btn--line:hover{ background:var(--mint); color:var(--ink); border-color:var(--teal-deep); }
  .err{ color:var(--danger); font-size:.92rem; }
  .hint{ font-size:.82rem; color:var(--ink-soft); }
  .done{ margin-top:8px; background:#fff; border:1px solid var(--mint-2); padding:28px 26px; display:grid; gap:14px; }
  .done h2{ font-weight:400; font-size:1.5rem; }
  .done p{ color:var(--ink-soft); }
  footer{ background:var(--teal-deep); color:#fff; text-align:center; font-size:.88rem; padding:20px 16px; }
  footer a{ color:#fff; }
</style>
</head>
<body>
<div class="bar" id="tag">Inspired by Nature. Perfected by Science</div>
<header>
  <div class="head">
    <a href="/" id="logoLink" aria-label="AVARA"><img src="/assets/logo.png" alt="AVARA" width="132" height="26"></a>
    <nav>
      <a href="/" id="back">Back to store</a>
      <button type="button" id="langBtn">العربية</button>
    </nav>
  </div>
</header>

<main>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <form id="reviewForm" novalidate>
    <label><span id="lNo"></span><input name="no" inputmode="numeric" autocomplete="off" dir="ltr" required></label>
    <label><span id="lPhone"></span><input name="phone" type="tel" autocomplete="tel" dir="ltr" required></label>
    <fieldset>
      <legend id="lRate"></legend>
      <div class="stars" id="stars" role="radiogroup" dir="ltr"></div>
    </fieldset>
    <label><span id="lName"></span><input name="name" type="text" maxlength="40" autocomplete="given-name"></label>
    <label><span id="lComment"></span><textarea name="comment" maxlength="600"></textarea></label>
    <p class="hint" id="hintPublic"></p>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn" type="submit" id="go"></button>
  </form>
  <section class="done" id="done" hidden aria-live="polite">
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
    <a class="btn btn--line" href="/" id="doneBack"></a>
  </section>
</main>
<footer id="foot"></footer>

<script>
(function(){
  'use strict';
  var lang = 'en';
  try{ lang = localStorage.getItem('avara-lang') === 'ar' ? 'ar' : 'en'; }catch(e){}
  var cfg = window.AVARA_CONFIG || {};
  var sb = (window.supabase && cfg.url && cfg.anonKey) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
  var rating = 0, finished = false;

  function $(s){ return document.querySelector(s); }
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var T = {
    en:{
      tag:'Inspired by Nature. Perfected by Science', back:'Back to store', lang:'العربية',
      title:'Review your order', lead:'Thank you for shopping with AVARA. Tell us how it went. Enter the order number and the phone number you used, so we know the review comes from a real order.',
      lNo:'Order number', lPhone:'Phone number', lRate:'Your rating', lName:'Your first name (optional)', lComment:'Your review (optional)',
      hintPublic:'Only your first name, your rating and your comment can appear on our website, and only after we approve them. Your phone number and order are never shown.',
      stars:['1 star','2 stars','3 stars','4 stars','5 stars'],
      go:'Send review', going:'Sending…',
      invalid:'Please enter your order number, the phone number you used, and choose a star rating.',
      notfound:'We could not find an order with those details. Please check the number and phone, or message us on WhatsApp.',
      not_delivered:'You can review an order once it has been delivered. Please come back after you receive it.',
      exists:'This order already has a review. Thank you!',
      busy:'Too many attempts. Please wait a few minutes or message us on WhatsApp.',
      fail:'Something went wrong. Please try again, or message us on WhatsApp.',
      doneTitle:'Thank you for your review', doneText:'We read every review. Yours will appear on our website after we approve it.', doneBack:'Back to store',
      foot:'© 2026 AVARA. All rights reserved.', privacy:'Privacy and policies'
    },
    ar:{
      tag:'مستوحاة من الطبيعة، مصقولة بالعلم', back:'العودة إلى المتجر', lang:'English',
      title:'قيّم طلبك', lead:'شكراً لتسوّقك من AVARA. أخبرنا كيف كانت تجربتك. أدخل رقم الطلب ورقم الهاتف الذي استخدمته، حتى نتأكد أن التقييم من طلب حقيقي.',
      lNo:'رقم الطلب', lPhone:'رقم الهاتف', lRate:'تقييمك', lName:'اسمك الأول (اختياري)', lComment:'رأيك (اختياري)',
      hintPublic:'يمكن أن يظهر على موقعنا اسمك الأول وتقييمك وتعليقك فقط، وذلك بعد موافقتنا عليها. لا يُعرض رقم هاتفك ولا طلبك أبداً.',
      stars:['نجمة واحدة','نجمتان','3 نجوم','4 نجوم','5 نجوم'],
      go:'إرسال التقييم', going:'جارٍ الإرسال…',
      invalid:'يرجى إدخال رقم الطلب ورقم الهاتف الذي استخدمته واختيار عدد النجوم.',
      notfound:'لم نعثر على طلب بهذه البيانات. يرجى التأكد من الرقم والهاتف، أو مراسلتنا عبر واتساب.',
      not_delivered:'يمكنك تقييم الطلب بعد تسليمه. يرجى العودة بعد استلامه.',
      exists:'هذا الطلب تم تقييمه من قبل. شكراً لك!',
      busy:'محاولات كثيرة. يرجى الانتظار بضع دقائق أو مراسلتنا عبر واتساب.',
      fail:'حدث خطأ ما. يرجى المحاولة مجدداً أو مراسلتنا عبر واتساب.',
      doneTitle:'شكراً لتقييمك', doneText:'نقرأ كل تقييم. سيظهر تقييمك على موقعنا بعد موافقتنا عليه.', doneBack:'العودة إلى المتجر',
      foot:'© 2026 AVARA. جميع الحقوق محفوظة.', privacy:'الخصوصية والسياسات'
    }
  };

  function paintStars(){
    var L = T[lang];
    $('#stars').innerHTML = [1,2,3,4,5].map(function(n){
      return '<input type="radio" name="rating" id="st' + n + '" value="' + n + '"' + (rating === n ? ' checked' : '') + '>' +
             '<label for="st' + n + '" class="' + (n <= rating ? 'on' : '') + '" title="' + esc(L.stars[n-1]) + '"><span aria-hidden="true">★</span><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">' + esc(L.stars[n-1]) + '</span></label>';
    }).join('');
  }

  function paintStatic(){
    var L = T[lang], h = document.documentElement;
    h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = 'AVARA — ' + L.title;
    $('#tag').textContent = L.tag; $('#back').textContent = L.back; $('#langBtn').textContent = L.lang;
    $('#title').textContent = L.title; $('#lead').textContent = L.lead;
    $('#lNo').textContent = L.lNo; $('#lPhone').textContent = L.lPhone; $('#lRate').textContent = L.lRate;
    $('#lName').textContent = L.lName; $('#lComment').textContent = L.lComment; $('#hintPublic').textContent = L.hintPublic;
    if(!$('#go').disabled) $('#go').textContent = L.go;
    $('#doneTitle').textContent = L.doneTitle; $('#doneText').textContent = L.doneText; $('#doneBack').textContent = L.doneBack;
    $('#foot').innerHTML = '<a href="/policies">' + esc(L.privacy) + '</a><br>' + esc(L.foot);
    var home = lang === 'ar' ? '/ar/' : '/';
    $('#back').setAttribute('href', home); $('#logoLink').setAttribute('href', home); $('#doneBack').setAttribute('href', home);
    paintStars();
  }

  function showErr(key){ var e = $('#err'); e.textContent = T[lang][key]; e.hidden = false; }

  $('#stars').addEventListener('change', function(e){
    rating = parseInt(e.target.value, 10) || 0;
    Array.prototype.forEach.call(document.querySelectorAll('#stars label'), function(l, i){ l.classList.toggle('on', i < rating); });
  });

  $('#reviewForm').addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target.elements, no = f.no.value.replace(/\D/g, ''), ph = f.phone.value.trim();
    $('#err').hidden = true;
    if(!no || ph.replace(/\D/g, '').length < 6 || !(rating >= 1)){ showErr('invalid'); return; }
    if(!sb){ showErr('fail'); return; }
    var btn = $('#go'); btn.disabled = true; btn.textContent = T[lang].going;
    sb.rpc('submit_review', {
      p_order_no: Number(no), p_phone: ph, p_rating: rating,
      p_comment: f.comment.value.trim() || null, p_name: f.name.value.trim() || null, p_lang: lang
    }).then(function(r){
      btn.disabled = false; btn.textContent = T[lang].go;
      if(r.error){ showErr(/too many/i.test(r.error.message || '') ? 'busy' : 'fail'); return; }
      var d = r.data || {};
      if(d.ok){ finished = true; $('#reviewForm').hidden = true; $('#done').hidden = false; return; }
      showErr(['notfound','not_delivered','exists','invalid'].indexOf(d.reason) >= 0 ? d.reason : 'fail');
    }).catch(function(){ btn.disabled = false; btn.textContent = T[lang].go; showErr('fail'); });
  });

  $('#langBtn').addEventListener('click', function(){
    lang = lang === 'ar' ? 'en' : 'ar';
    try{ localStorage.setItem('avara-lang', lang); }catch(e){}
    paintStatic(); $('#err').hidden = true;
  });

  // Links from the "request a review" message use /review?no=123
  var q = new URLSearchParams(location.search).get('no');
  if(q) $('#reviewForm').elements.no.value = q.replace(/\D/g, '');

  paintStatic();
})();
</script>
<script src="/assets/float-contact.js" defer></script>
</body>
</html>
